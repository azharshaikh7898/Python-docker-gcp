name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t cloudrun-api:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d --name api -p 8080:8080 cloudrun-api:${{ github.sha }}
          sleep 5
          curl --fail http://localhost:8080/health
          docker logs api
